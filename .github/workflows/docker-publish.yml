# .github/workflows/docker-publish.yml
#
# Builds and pushes two images to Docker Hub whenever you push a version tag:
#
#   souma061/webhook-relay:<version>          ← the Python API + workers
#   souma061/webhook-relay-dashboard:<version> ← the React dashboard (nginx)
#   souma061/webhook-relay:latest             ← always points to newest release
#
# HOW TO TRIGGER
# ─────────────────────────────────────────────────────────────────────────────
# 1. Commit your changes and push to main.
# 2. Tag the release:
#      git tag v1.0.0
#      git push origin v1.0.0
# 3. GitHub Actions automatically:
#      - Runs all unit tests
#      - Builds both images for linux/amd64 + linux/arm64 (Mac M1 support)
#      - Pushes to Docker Hub
#
# SECRETS REQUIRED (set in GitHub → Settings → Secrets → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   DOCKERHUB_USERNAME  →  your Docker Hub username (souma061)
#   DOCKERHUB_TOKEN     →  a Docker Hub Access Token (NOT your password)
#                          Create at: https://hub.docker.com/settings/security
#
# A workflow also runs on every push to main to run tests (no image push).

name: CI / Publish to Docker Hub

on:
  push:
    branches: [main]          # runs tests on every push to main
    tags:
      - 'v*.*.*'              # pushes image only on version tags (v1.0.0, v2.1.3 …)
  pull_request:
    branches: [main]          # runs tests on PRs to main

jobs:

  # ── Job 1: Run unit tests ────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: webhook_relay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short

  # ── Job 2: Build and push images ──────────────────────────────────────────────
  # Only runs on version tags (v*.*.*), and only if tests passed.
  docker-publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extracts the version from the tag, e.g. refs/tags/v1.2.3 → 1.2.3
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # QEMU lets us build ARM64 images on GitHub's x86 runners (Mac M1 support)
      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      # Buildx is the modern Docker builder with multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Image 1: API + workers ─────────────────────────────────────────────
      - name: Build and push — API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Tags: both the specific version AND 'latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay:latest
          # Layer cache from Docker Hub — speeds up rebuilds dramatically
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay:buildcache,mode=max

      # ── Image 2: Dashboard (React + nginx) ────────────────────────────────
      - name: Build and push — Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay-dashboard:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay-dashboard:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay-dashboard:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay-dashboard:buildcache,mode=max

      # Update the Docker Hub description from README.md automatically
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/webhook-relay
          readme-filepath: ./README.md
