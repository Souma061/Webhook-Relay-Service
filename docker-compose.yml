# Webhook Relay Service — Production Compose File
#
# QUICKSTART
# ----------
# 1. Copy the config template:
#      cp .env.example .env
#
# 2. Generate secret keys and fill them in .env:
#      python3 -c "import secrets; print(secrets.token_urlsafe(48))"
#      (run twice — once for JWT_SECRET_KEY, once for PASSWORD_PEPPER)
#
# 3. Start the stack:
#      docker compose up -d
#
# 4. Open the dashboard:  http://localhost:8080
#    API docs:            http://localhost:8000/docs
#
# UPDATING
# --------
#   docker compose pull && docker compose up -d
#
# STOPPING / REMOVING
# -------------------
#   docker compose down          # stop containers, keep data
#   docker compose down -v       # stop containers AND delete all data

services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  app:
    image: souma061/webhook-relay:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Transform Worker ──────────────────────────────────────────────────────────
  transform-worker:
    image: souma061/webhook-relay:latest
    command: python -m workers.transform_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Delivery Worker ───────────────────────────────────────────────────────────
  delivery-worker:
    image: souma061/webhook-relay:latest
    command: python -m workers.delivery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  # ── Dashboard (React + nginx) ─────────────────────────────────────────────────
  dashboard:
    image: souma061/webhook-relay-dashboard:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook_relay
      POSTGRES_USER: ${RELAY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RELAY_POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RELAY_POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data

  # ── Kafka (KRaft — no ZooKeeper) ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  kafkadata:
