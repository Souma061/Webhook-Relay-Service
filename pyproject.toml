[project]
name = "webhook-relay"
version = "0.1.0"
description = "Self-hosted webhook relay and transformation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "redis[asyncio]>=5.2.0",
    "httpx>=0.28.0",
    "aiokafka>=0.12.0",
    "jmespath>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["app*", "workers*"]
exclude = ["dashboard*", "k8s*", "tests*"]

[tool.setuptools.package-data]
"app.config" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
